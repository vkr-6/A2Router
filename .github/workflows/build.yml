name: A2Router build

on:
  workflow_dispatch:
    inputs:
      build_driver:
        description: Build the unsigned Windows virtual audio driver (WDK)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a2router-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 portable application
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build, check and package
        shell: pwsh
        run: ./tools/windows/build-portable.ps1 -Workspace "$env:RUNNER_TEMP/a2router-build" -Headless
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: A2Router-windows-x64
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A2Router-windows-x64-zip
          path: dist/a2router-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload native tools
        uses: actions/upload-artifact@v4
        with:
          name: A2Router-windows-native
          path: dist/windows-native/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux source checks and private PipeWire tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-x11 libegl1 libopengl0
      - run: python -m pip install -e '.[test]'
      - run: ruff check a2router tests tools/windows
      - run: ruff format --check a2router tests tools/windows
      - run: python -m pytest -q
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Isolated real PipeWire integration
        run: dbus-run-session -- python tests/run_private_pipewire.py

  windows-driver:
    name: Windows x64 unsigned driver (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.build_driver
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: NuGet/setup-nuget@v2
      - name: Build with matching WDK and SDK NuGet packages
        shell: pwsh
        run: ./tools/windows/build-driver.ps1 -UseNuGet -NuGetPackageRoot "$env:RUNNER_TEMP/a2router-wdk"
      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v4
        with:
          name: A2Router-driver-x64-UNSIGNED
          path: build/windows-driver/package/
          if-no-files-found: error
          retention-days: 14
