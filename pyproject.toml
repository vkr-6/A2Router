[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2router"
version = "0.1.0"
description = "Advanced Audio Router: native audio-server routing with a Qt settings interface"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.17.1"]
build = ["pyinstaller>=6.11,<7", "cmake>=3.20", "ninja>=1.11"]

[project.scripts]
a2router = "a2router.__main__:main"

[tool.setuptools.packages.find]
include = ["a2router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in real audio server tests"]

[tool.ruff]
line-length = 110
